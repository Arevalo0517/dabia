<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DABIA — Redirecting</title>
  <meta http-equiv="refresh" content="0; url=/en/" />
  <link rel="canonical" href="/en/" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#070910" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <style>
    html, body { margin: 0; background: #070910; color: #f7f9fc; font: 400 16px/1.5 'Inter', system-ui, -apple-system, sans-serif; min-height: 100dvh; }
    body { display: grid; place-items: center; padding: 24px; }
    main { display: grid; gap: 12px; justify-items: center; text-align: center; }
    h1 { font: 800 22px/1.3 system-ui; margin: 0; letter-spacing: -.02em; }
    p { color: #9aa7b8; margin: 0; }
    a { color: #cabfff; text-decoration: none; padding: 12px 20px; border-radius: 999px; background: linear-gradient(180deg, #7c5cff 0%, #5b3df4 100%); color: #fff; font-weight: 600; }
    a:hover { background: linear-gradient(180deg, #8e72ff 0%, #6f54ff 100%); }
  </style>
</head>
<body>
  <main id="main">
    <h1>Taking you to the English site…</h1>
    <p>or visit <a href="/en/">/en/</a> directly · <a href="/es/" style="background:transparent;color:#cabfff;padding:0;text-decoration:underline;font-weight:400">Español →</a></p>
  </main>
</body>
</html>
